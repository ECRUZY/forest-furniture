<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="format-detection" content="telephone=no">
<title>Forest Furniture</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F5F0EA;color:#2C1A0E}

.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:0.5px solid #E0D5C8;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo img{height:46px;width:auto;display:block}
.hright{display:flex;align-items:center;gap:8px}
.ibtn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.itg{background:#29A8E2}.iwa{background:#25D366}
.ibtn svg{width:18px;height:18px}
.phone{font-size:13px;font-weight:700;color:#3D2B1A;white-space:nowrap;text-decoration:none}

.searchbar{background:#fff;padding:10px 14px;border-bottom:0.5px solid #E0D5C8}
.searchbar input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid #C4A882;font-size:14px;font-family:inherit;background:#FAF7F3;color:#2C1A0E;outline:none}
.searchbar input::placeholder{color:#B09070}

.filters{background:#fff;padding:8px 14px;border-bottom:0.5px solid #E0D5C8;overflow-x:auto;scrollbar-width:none}
.frow{display:flex;gap:7px;white-space:nowrap}
.chip{padding:6px 14px;border-radius:20px;border:1px solid #C4A882;background:transparent;font-size:12px;color:#7A5240;cursor:pointer;font-family:inherit;transition:all .15s}
.chip.on{background:#3D2B1A;color:#fff;border-color:#3D2B1A}

.countbar{padding:8px 16px 4px;font-size:12px;color:#A08060}
.products{padding:12px 14px;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}

.card{background:#fff;border-radius:16px;border:0.5px solid #E0D5C8;overflow:hidden}
.card-img{width:100%;height:210px;position:relative;overflow:hidden;background:#EDE5DA;display:flex;align-items:center;justify-content:center}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.no-photo{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#EDE5DA}
.badge{position:absolute;top:10px;left:10px;background:rgba(61,43,26,0.7);color:#fff;font-size:10px;padding:3px 10px;border-radius:20px}

.body{padding:13px 14px 14px}
.title{font-size:16px;font-weight:700;color:#2C1A0E;margin-bottom:2px}
.subtitle{font-size:12px;color:#A08060;margin-bottom:10px;min-height:16px}

.attr{background:#F7F2EC;border-radius:9px;padding:9px 11px;margin-bottom:7px}
.alabel{font-size:10px;color:#A08060;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{background:#E8E2D9;color:#3D2B1A;font-size:12px;padding:4px 10px;border-radius:6px;white-space:nowrap;pointer-events:none;user-select:none}

.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border:none;border-radius:10px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none}
.btn svg{width:16px;height:16px}
.btg{background:#29A8E2;color:#fff}.bwa{background:#25D366;color:#fff}.bcall{background:#3D2B1A;color:#fff}

.empty{text-align:center;padding:60px 20px;color:#A08060;font-size:15px}

.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;align-items:center;justify-content:center}
.overlay.open{display:flex}
.mbox{background:#fff;border-radius:20px;padding:24px;text-align:center;width:280px;max-width:90vw}
.mbox img{width:200px;height:200px;margin:12px auto;display:block}
.mtitle{font-size:15px;font-weight:700;color:#2C1A0E;margin-bottom:4px}
.msub{font-size:12px;color:#A08060}
.mclose{margin-top:16px;padding:10px 28px;border:none;border-radius:10px;background:#F0EAE0;color:#3D2B1A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
