<title>Forest Furniture — Кухни</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#F5F0EA;color:#2C1A0E}
.header{position:sticky;top:0;z-index:100;background:#fff;border-bottom:0.5px solid #E0D5C8;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo img{height:46px;width:auto;display:block}
.hright{display:flex;align-items:center;gap:8px}
.ibtn{width:36px;height:36px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;text-decoration:none;flex-shrink:0}
.itg{background:#29A8E2}.iwa{background:#25D366}
.ibtn svg{width:18px;height:18px}
.phone{font-size:13px;font-weight:700;color:#3D2B1A;white-space:nowrap;text-decoration:none}
.searchbar{background:#fff;padding:10px 14px;border-bottom:0.5px solid #E0D5C8}
.searchbar input{width:100%;padding:9px 14px;border-radius:20px;border:1px solid #C4A882;font-size:14px;font-family:inherit;background:#FAF7F3;color:#2C1A0E;outline:none}
.searchbar input::placeholder{color:#B09070}
.cat-bar{background:#fff;padding:10px 16px;border-bottom:0.5px solid #E0D5C8;display:flex;align-items:center;justify-content:space-between}
.cat-title{font-size:15px;font-weight:700;color:#2C1A0E}
.cat-subs{display:flex;gap:6px}
.chip{padding:6px 14px;border-radius:20px;border:1px solid #C4A882;background:transparent;font-size:12px;color:#7A5240;cursor:pointer;font-family:inherit}
.chip.on{background:#3D2B1A;color:#fff;border-color:#3D2B1A}
.slider-wrap{background:#fff;padding:12px 16px 14px;border-bottom:0.5px solid #E0D5C8}
.slider-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.slider-label{font-size:11px;color:#A08060;text-transform:uppercase;letter-spacing:.6px}
.slider-val{font-size:13px;font-weight:700;color:#3D2B1A}
.range-track{position:relative;height:4px;background:#E0D5C8;border-radius:2px;margin:10px 0}
.range-fill{position:absolute;height:100%;background:#5C3D2E;border-radius:2px}
.range-track input[type=range]{position:absolute;width:100%;height:100%;opacity:0;cursor:pointer;top:0;left:0;margin:0;-webkit-appearance:none;pointer-events:auto}
.range-thumb{position:absolute;top:50%;transform:translate(-50%,-50%);width:20px;height:20px;background:#3D2B1A;border-radius:50%;pointer-events:none;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.2);z-index:1}
.countbar{padding:8px 16px 4px;font-size:12px;color:#A08060}
.products{padding:12px 14px;display:flex;flex-direction:column;gap:14px;padding-bottom:40px}
.card{background:#fff;border-radius:16px;border:0.5px solid #E0D5C8;overflow:hidden;cursor:pointer}
.card-img{
  width:100%;
  aspect-ratio: 16 / 9;
  height:auto;
  position:relative;
  overflow:hidden;
  background:#F5F0EA;
}
.car-wrap{width:100%;height:100%;display:flex;transition:transform .3s}
.car-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center center;
  flex-shrink:0;
  display:block;
}
.car-btn{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.35);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center}
.car-prev{left:8px}.car-next{right:8px}
.car-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}
.dot.on{background:#fff}
.badge{position:absolute;top:10px;left:10px;background:rgba(61,43,26,.7);color:#fff;font-size:10px;padding:3px 10px;border-radius:20px;z-index:2}
.body{padding:13px 14px 14px}
.title{font-size:16px;font-weight:700;color:#2C1A0E;margin-bottom:2px}
.subtitle{font-size:12px;color:#A08060;margin-bottom:10px}
.attr{background:#F7F2EC;border-radius:9px;padding:9px 11px;margin-bottom:7px}
.alabel{font-size:10px;color:#A08060;text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.aval{font-size:13px;color:#2C1A0E}
.size-btns{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{padding:5px 12px;border-radius:8px;border:1.5px solid #C4A882;background:#fff;color:#5C3D2E;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap}
.sbtn.on{background:#3D2B1A;color:#fff;border-color:#3D2B1A}
.color-tags{display:flex;flex-wrap:wrap;gap:5px}
.ctag{background:#EDE5DA;color:#5C3D2E;font-size:12px;padding:5px 12px;border-radius:8px;white-space:nowrap;display:inline-block;border:1.5px solid #C4A882;font-weight:500}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:12px}
.btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px;border:none;border-radius:10px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none}
.btn svg{width:16px;height:16px}
.btg{background:#29A8E2;color:#fff}.bwa{background:#25D366;color:#fff}.bcall{background:#3D2B1A;color:#fff}
.empty{text-align:center;padding:60px 20px;color:#A08060;font-size:15px}
.moverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;align-items:flex-end;justify-content:center}
.moverlay.open{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding-bottom:32px}
.mclose-row{position:sticky;top:0;background:#fff;padding:12px 16px 8px;display:flex;justify-content:flex-end;z-index:10}
.mclose-btn{background:#F0EAE0;border:none;border-radius:50%;width:32px;height:32px;font-size:18px;cursor:pointer;color:#3D2B1A}
.mcar{width:100%;height:280px;position:relative;overflow:hidden;background:#EDE5DA}
.mcar .car-wrap{height:100%}
.thumbs{display:flex;gap:8px;padding:10px 16px;overflow-x:auto;scrollbar-width:none}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;object-position:center;border:2px solid transparent;cursor:pointer;flex-shrink:0}
.thumb.on{border-color:#3D2B1A}
.mbody{padding:14px 16px 8px}
.mtitle{font-size:19px;font-weight:700;color:#2C1A0E;margin-bottom:3px}
.msub{font-size:13px;color:#A08060;margin-bottom:12px}
.qoverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:400;align-items:center;justify-content:center}
.qoverlay.open{display:flex}
.qbox{background:#fff;border-radius:20px;padding:24px;text-align:center;width:280px;max-width:90vw}
.qbox img{width:200px;height:200px;margin:12px auto;display:block}
.qtitle{font-size:15px;font-weight:700;color:#2C1A0E;margin-bottom:4px}
.qsub{font-size:12px;color:#A08060}
.qclose{margin-top:16px;padding:10px 28px;border:none;border-radius:10px;background:#F0EAE0;color:#3D2B1A;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

<script>
var TG="https://t.me/deznthe";
var WA_BASE="https://wa.me/79991443200?text=";
var CALL="tel:+79991443200";

var ALL = JSON.parse(document.getElementById("d-items").textContent);
var SUBS = JSON.parse(document.getElementById("d-subs").textContent);
var cur = "Все";
var minLen = 120, maxLen = 540;
var curItem = null, mCarIdx = 0, selectedSizes = {}, selectedColors = {};

function icon(id){ return document.getElementById(id).firstElementChild.cloneNode(true); }

function setupModalBtns(){
  var btg=document.getElementById("mbtn-tg"),bwa=document.getElementById("mbtn-wa"),bc=document.getElementById("mbtn-call");
  btg.innerHTML=""; btg.appendChild(icon("svg-tg")); btg.appendChild(document.createTextNode("Telegram"));
  bwa.innerHTML=""; bwa.appendChild(icon("svg-wa")); bwa.appendChild(document.createTextNode("WhatsApp"));
  bc.innerHTML="";  bc.appendChild(icon("svg-call")); bc.appendChild(document.createTextNode("Позвонить"));
}
setupModalBtns();

function getFirstLen(sizeStr){
  if(!sizeStr)return null;
  var parts=sizeStr.split("/");
  for(var i=0;i<parts.length;i++){var n=parseInt(parts[i].trim().split("×")[0]);if(!isNaN(n))return n;}
  return null;
}
function getSizes(p){
  if(!p.size)return [];
  return p.size.split("/").map(function(s){return s.trim();}).filter(Boolean);
}
function waLink(p,sz,col){
  var lines=["Здравствуйте! Меня интересует кухня:","Название: "+p.name,"Тип: "+p.type];
  if(p.producer)lines.push("Производитель: "+p.producer);
  var c=col||selectedColors[p.id]||p.color||"";
  if(c)lines.push("Цвет: "+c);
  var s=sz||p.size||""; if(s)lines.push("Размер: "+s+" см");
  if(p.desc)lines.push(p.desc);
  lines.push("","Подскажите, пожалуйста!");
  return WA_BASE+encodeURIComponent(lines.join("\n"));
}

// Subtype filter chips
var frow=document.getElementById("frow");
SUBS.forEach(function(t){
  var b=document.createElement("button");
  b.className="chip"+(t===cur?" on":""); b.textContent=t;
  b.onclick=function(){cur=t;frow.querySelectorAll(".chip").forEach(function(x){x.classList.toggle("on",x.textContent===t);});render();};
  frow.appendChild(b);
});

// Range slider
function updateThumbs(){
  var pMin=(minLen-120)/(540-120), pMax=(maxLen-120)/(540-120);
  document.getElementById("thumb-min").style.left=(pMin*100)+"%";
  document.getElementById("thumb-max").style.left=(pMax*100)+"%";
  document.getElementById("range-fill").style.left=(pMin*100)+"%";
  document.getElementById("range-fill").style.width=((pMax-pMin)*100)+"%";
  document.getElementById("range-val").textContent=minLen+" — "+maxLen+" см";
}
function onRange(){
  var a=parseInt(document.getElementById("range-min").value), b=parseInt(document.getElementById("range-max").value);
  if(a>b){var tmp=a;a=b;b=tmp;} minLen=a;maxLen=b; updateThumbs(); render();
}
setTimeout(updateThumbs,50);

function carMove(id,dir,e){
  if(e)e.stopPropagation();
  var cw=document.getElementById("cw"+id),n=parseInt(cw.dataset.n);
  var idx=(parseInt(cw.dataset.idx||0)+dir+n)%n;
  cw.dataset.idx=idx;
  cw.querySelector(".car-wrap").style.transform="translateX(-"+(idx*100)+"%)";
  var dc=document.getElementById("dc"+id);
  if(dc)dc.querySelectorAll(".dot").forEach(function(d,i){d.classList.toggle("on",i===idx);});
}

function selectSize(pid,size){
  selectedSizes[pid]=size;
  var card=document.getElementById("card"+pid);
  if(card){
    card.querySelectorAll(".sbtn[data-sz]").forEach(function(b){b.classList.toggle("on",b.dataset.sz===size);});
    var wa=card.querySelector(".wa-link");
    if(wa)wa.href=waLink(ALL.find(function(x){return x.id===pid;}),size,selectedColors[pid]);
  }
}

function openModal(id){
  var p=ALL.find(function(x){return x.id===id;}); if(!p)return;
  curItem=p; mCarIdx=0;
  document.getElementById("mtitle").textContent="Кухня «"+p.name+"» · "+p.type;
  document.getElementById("msub").textContent=[p.producer,p.color].filter(Boolean).join(" · ");
  var sizes=getSizes(p), minfo=document.getElementById("minfo"); minfo.innerHTML="";
  if(sizes.length>0){
    var a=document.createElement("div");a.className="attr";
    var l=document.createElement("div");l.className="alabel";l.textContent="Размеры (см)";
    var sr=document.createElement("div");sr.className="size-btns";
    sizes.forEach(function(s,i){
      var b=document.createElement("button");b.className="sbtn"+(i===0?" on":"");b.dataset.sz=s;b.textContent=s;
      b.onclick=function(){minfo.querySelectorAll(".sbtn").forEach(function(x){x.classList.toggle("on",x.dataset.sz===s);});selectedSizes[p.id]=s;document.getElementById("mbtn-wa").href=waLink(p,s);};
      sr.appendChild(b);
    });
    a.appendChild(l);a.appendChild(sr);minfo.appendChild(a);
  }
  if(p.color){
    var mcolors=p.color.split(" / ").map(function(c){return c.trim();});
    var a2=document.createElement("div");a2.className="attr";
    var l2=document.createElement("div");l2.className="alabel";l2.textContent="Цвет";
    var cv2=document.createElement("div");cv2.className="size-btns";
    mcolors.forEach(function(c,ci){
      var t=document.createElement("button");t.className="sbtn"+(ci===0?" on":"");t.textContent=c;
      t.onclick=function(){
        cv2.querySelectorAll(".sbtn").forEach(function(x){x.classList.toggle("on",x.textContent===c);});
        selectedColors[p.id]=c;
        var sz=selectedSizes[p.id]||getSizes(p)[0]||"";
        document.getElementById("mbtn-wa").href=waLink(p,sz,c);
      };
      cv2.appendChild(t);
    });
    if(!selectedColors[p.id])selectedColors[p.id]=mcolors[0];
    a2.appendChild(l2);a2.appendChild(cv2);minfo.appendChild(a2);
  }
  if(p.desc){
    var a3=document.createElement("div");a3.className="attr";
    var l3=document.createElement("div");l3.className="alabel";l3.textContent="Описание";
    var v3=document.createElement("div");v3.className="aval";v3.textContent=p.desc;
    a3.appendChild(l3);a3.appendChild(v3);minfo.appendChild(a3);
  }
  var mcar=document.getElementById("mcar");mcar.innerHTML="";
  var cw=document.createElement("div");cw.className="car-wrap";cw.id="mcarwrap";
  p.photos.forEach(function(src){var img=document.createElement("img");img.src=src;cw.appendChild(img);});
  mcar.appendChild(cw);
  if(p.photos.length>1){
    var prev=document.createElement("button");prev.className="car-btn car-prev";prev.textContent="‹";prev.onclick=function(){mMove(-1);};
    var next=document.createElement("button");next.className="car-btn car-next";next.textContent="›";next.onclick=function(){mMove(1);};
    mcar.appendChild(prev);mcar.appendChild(next);
  }
  var thumbs=document.getElementById("mthumbs");thumbs.innerHTML="";
  if(p.photos.length>1){
    p.photos.forEach(function(src,i){var img=document.createElement("img");img.className="thumb"+(i===0?" on":"");img.src=src;var idx=i;img.onclick=function(){mSet(idx);};thumbs.appendChild(img);});
    thumbs.style.display="flex";
  }else{thumbs.style.display="none";}
  var chosenSize=selectedSizes[p.id]||sizes[0]||"";
  document.getElementById("mbtn-wa").href=waLink(p,chosenSize);
  document.getElementById("mbtn-tg").href=TG;
  document.getElementById("mbtn-call").href=CALL;
  document.getElementById("moverlay").classList.add("open");
  document.body.style.overflow="hidden";
}
function closeModal(){document.getElementById("moverlay").classList.remove("open");document.body.style.overflow="";}
function mMove(dir){mCarIdx=(mCarIdx+dir+curItem.photos.length)%curItem.photos.length;mSet(mCarIdx);}
function mSet(idx){mCarIdx=idx;document.getElementById("mcarwrap").style.transform="translateX(-"+(idx*100)+"%)";document.querySelectorAll("#mthumbs .thumb").forEach(function(t,i){t.classList.toggle("on",i===idx);});}

function render(){
  var q=document.getElementById("search").value.trim().toLowerCase();
  var list=ALL.filter(function(p){
    var matchSub=cur==="Все"||p.type===cur;
    var matchSearch=!q||p.name.toLowerCase().indexOf(q)>=0||p.producer.toLowerCase().indexOf(q)>=0;
    var fl=getFirstLen(p.size);
    var matchLen=fl===null||(fl>=minLen&&fl<=maxLen);
    return matchSub&&matchSearch&&matchLen;
  });
  document.getElementById("cbar").textContent="Показано: "+list.length+" позиций";
  var prod=document.getElementById("prod");prod.innerHTML="";
  if(!list.length){var em=document.createElement("div");em.className="empty";em.textContent="Ничего не найдено";prod.appendChild(em);return;}
  list.forEach(function(p){
    var sizes=getSizes(p),chosenSize=selectedSizes[p.id]||sizes[0]||"";
    var sub=p.producer||"";
    var card=document.createElement("div");card.className="card";card.id="card"+p.id;
    card.onclick=function(){openModal(p.id);};
    var imgArea=document.createElement("div");imgArea.className="card-img";
    var cwrap=document.createElement("div");cwrap.id="cw"+p.id;cwrap.dataset.idx="0";cwrap.dataset.n=p.photos.length;
    var cinner=document.createElement("div");cinner.className="car-wrap";
    p.photos.forEach(function(src){var img=document.createElement("img");img.src=src;cinner.appendChild(img);});
    cwrap.appendChild(cinner);
    if(p.photos.length>1){
      var prev=document.createElement("button");prev.className="car-btn car-prev";prev.textContent="‹";prev.onclick=function(e){carMove(p.id,-1,e);};
      var next=document.createElement("button");next.className="car-btn car-next";next.textContent="›";next.onclick=function(e){carMove(p.id,1,e);};
      cwrap.appendChild(prev);cwrap.appendChild(next);
      var dc=document.createElement("div");dc.className="car-dots";dc.id="dc"+p.id;
      p.photos.forEach(function(_,i){var d=document.createElement("div");d.className="dot"+(i===0?" on":"");dc.appendChild(d);});
      cwrap.appendChild(dc);
    }
    var badge=document.createElement("span");badge.className="badge";badge.textContent=p.type;
    imgArea.appendChild(cwrap);imgArea.appendChild(badge);
    var body=document.createElement("div");body.className="body";
    var titleEl=document.createElement("div");titleEl.className="title";titleEl.textContent="Кухня «"+p.name+"»";
    var subEl=document.createElement("div");subEl.className="subtitle";subEl.textContent=sub;
    body.appendChild(titleEl);body.appendChild(subEl);
    if(p.color){
      var colors=p.color.split(" / ").map(function(c){return c.trim();});
      var selColor=colors[0];
      var ca=document.createElement("div");ca.className="attr";
      var cl=document.createElement("div");cl.className="alabel";cl.textContent="Цвет";
      var cv=document.createElement("div");cv.className="size-btns";
      colors.forEach(function(c,ci){
        var t=document.createElement("button");t.className="sbtn"+(ci===0?" on":"");t.textContent=c;
        t.onclick=function(e){
          e.stopPropagation();
          selColor=c;
          cv.querySelectorAll(".sbtn").forEach(function(x){x.classList.toggle("on",x.textContent===c);});
          selectedColors[p.id]=c;
          var wa=card.querySelector(".wa-link");
          if(wa)wa.href=waLink(p,selectedSizes[p.id]||sizes[0]||"",c);
        };
        cv.appendChild(t);
      });
      selectedColors[p.id]=selColor;
      ca.appendChild(cl);ca.appendChild(cv);body.appendChild(ca);
    }
    if(sizes.length>0){
      var attr=document.createElement("div");attr.className="attr";
      var lbl=document.createElement("div");lbl.className="alabel";lbl.textContent="Размеры (см)";
      var sbrow=document.createElement("div");sbrow.className="size-btns";
      sizes.forEach(function(s,i){
        var b=document.createElement("button");b.className="sbtn"+(i===0?" on":"");b.textContent=s;b.dataset.sz=s;
        b.onclick=function(e){e.stopPropagation();selectSize(p.id,s);};
        sbrow.appendChild(b);
      });
      attr.appendChild(lbl);attr.appendChild(sbrow);body.appendChild(attr);
    }
    var btns=document.createElement("div");btns.className="btns";
    var atg=document.createElement("a");atg.className="btn btg";atg.href=TG;atg.target="_blank";atg.onclick=function(e){e.stopPropagation();};atg.appendChild(icon("svg-tg"));atg.appendChild(document.createTextNode("Telegram"));
    var awa=document.createElement("a");awa.className="btn bwa wa-link";awa.href=waLink(p,chosenSize);awa.target="_blank";awa.onclick=function(e){e.stopPropagation();};awa.appendChild(icon("svg-wa"));awa.appendChild(document.createTextNode("WhatsApp"));
    var acall=document.createElement("a");acall.className="btn bcall";acall.href=CALL;acall.onclick=function(e){e.stopPropagation();};acall.appendChild(icon("svg-call"));acall.appendChild(document.createTextNode("Позвонить"));
    btns.appendChild(atg);btns.appendChild(awa);btns.appendChild(acall);
    body.appendChild(btns);card.appendChild(imgArea);card.appendChild(body);prod.appendChild(card);
  });
}
render();

</script></body></html>
