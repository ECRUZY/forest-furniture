<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Forest Furniture</title>
<script>
  // GitHub Pages и Vercel показывают этот файл для любого несуществующего адреса.
  // Ссылка на модель вида …/kitchens/12/ работает, даже если её страница-превью
  // ещё не создана в админке: отправляем человека в каталог сразу на модель.
  (function () {
    var path = location.pathname;
    var m = path.match(/^(.*?\/)([a-z-]+)\/(\d+)(?:\/(\d+))?\/?$/);
    if (m) {
      location.replace(m[1] + "#" + m[2] + "/" + m[3] + (m[4] ? "/" + m[4] : ""));
      return;
    }
    // Иначе — на главную каталога (на github.io сайт лежит в папке репозитория)
    var seg = path.split("/")[1];
    var base = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
    window.__home = base;
  })();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #F3EFE8; color: #1B1A17; text-align: center; }
  h1 { font-family: Georgia, serif; font-weight: 600; font-size: 34px; margin: 0 0 8px; }
  p { color: #4E4840; margin: 0 0 20px; }
  a { display: inline-block; padding: 14px 22px; border-radius: 14px; background: #23392C; color: #F3EFE8; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
  <div>
    <h1>Страница не найдена</h1>
    <p>Возможно, ссылка устарела. Весь каталог — по кнопке ниже.</p>
    <a id="home" href="/">Открыть каталог</a>
  </div>
  <script>if (window.__home) document.getElementById("home").href = window.__home;</script>
</body>
</html>
